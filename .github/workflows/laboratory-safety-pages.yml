name: Publish Laboratory Safety Practices e-book
on:
  push:
    branches: [main]
    paths:
      - 'public/laboratory-safety-practices/**'
      - '.github/workflows/laboratory-safety-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: laboratory-safety-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload e-book website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/laboratory-safety-practices
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
