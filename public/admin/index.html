<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Moderasi Testimoni | XSys.Advisory</title><style>body{font:16px system-ui,Arial;background:#f3faf9;color:#173946;margin:0;padding:25px}main{max-width:1000px;margin:auto}h1{font-size:27px}.card{padding:20px;background:white;border:1px solid #d5e8e5;border-radius:14px;margin:15px 0}input,textarea{padding:12px;border:1px solid #abcac7;border-radius:8px;max-width:100%;box-sizing:border-box}input{width:100%}button{padding:12px 18px;border:0;background:#008d7e;color:white;border-radius:9px;cursor:pointer;margin:4px}button.reject{background:#b33e3e}button.hold{background:#5f6f76}small{color:#6e858c}#message{padding:8px;min-height:26px}img{max-width:240px;max-height:200px;object-fit:contain}blockquote{line-height:1.6}a{color:#007d73}</style></head><body><main><h1>Panel Moderasi Testimoni</h1><p>Hanya admin berwenang. Semua kiriman baru berstatus pending sampai disetujui.</p><div class="card"><label>Token rahasia admin (disimpan hanya selama tab ini dibuka)<input type="password" id="token" autocomplete="off" placeholder="Masukkan token XSYS_MODERATOR_TOKEN"></label><p><button id="load">Ambil kiriman</button><button id="logout" class="hold">Hapus token</button></p><small>Jangan bagikan token atau screenshot yang memuat token. Masukkan setelah Netlify Functions dikonfigurasi.</small></div><p id="message" role="status"></p><div id="entries"></div></main><script>
const $=s=>document.querySelector(s), el=(tag,txt)=>{const x=document.createElement(tag);x.textContent=txt||'';return x};
async function api(method,path,body){let r=await fetch('/.netlify/functions/testimonial-admin'+path,{method,headers:{'Authorization':'Bearer '+$('#token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});let v=await r.json().catch(()=>({error:'Respons server tidak valid'}));if(!r.ok)throw Error(v.error||'HTTP '+r.status);return v;}
async function load(){let box=$('#entries');box.replaceChildren();$('#message').textContent='Memuat kiriman...';try{let result=await api('GET','');$('#message').textContent=result.items.length+' kiriman ditemukan';for(let i of result.items){let card=el('article');card.className='card';card.append(el('h3',i.name||'Peserta'),el('p',(i.program||'')+' | '+(i.organization||'')),el('blockquote','“'+(i.comment||'')+'”'),el('p','Status: '+i.status));if(i.photo){let link=el('a','Lihat foto yang dikirim');link.href=i.photo;link.target='_blank';link.rel='noopener noreferrer';card.append(link)}let buttons=el('div');for(let [status,label,cls] of [['approved','Setujui',''],['rejected','Tolak','reject'],['pending','Tunda','hold']]){let b=el('button',label);b.className=cls;b.onclick=async()=>{if(!confirm('Ubah status ke '+label+'?'))return;b.disabled=true;try{await api('POST','',{id:i.id,status});await load()}catch(e){alert(e.message);b.disabled=false}};buttons.append(b)}card.append(buttons);box.append(card)}}catch(e){$('#message').textContent='Gagal: '+e.message}}
$('#load').onclick=load;$('#logout').onclick=()=>{$('#token').value='';$('#entries').replaceChildren();$('#message').textContent='Token sudah dihapus dari form'};
</script></body></html>
