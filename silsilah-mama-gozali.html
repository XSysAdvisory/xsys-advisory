<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silsilah Mama Gozali</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#243e34;font:16px system-ui}header{background:#234b3d;color:white;padding:32px 20px;text-align:center}main{max-width:1000px;margin:auto;padding:18px}section,details{background:white;border:1px solid #d8dfd7;border-radius:12px;padding:14px;margin:10px 0}details details{margin-left:12px;border-left:3px solid #8fae98}summary{cursor:pointer;font-weight:bold}button,input,select{font:inherit;padding:10px;border:1px solid #b5c4ba;border-radius:8px;margin:4px}button{background:#234b3d;color:white;cursor:pointer}input,select{max-width:100%}small{color:#586b60}label{display:block}form{display:grid;gap:6px} @media print{form,button,input,.notice{display:none}}</style><header><small style="color:#ddd">ARSIP KELUARGA</small><h1>Silsilah Mama Gozali</h1><p>Merawat silaturahmi, menjaga jejak generasi</p></header><main><section class="notice"><b>Versi uji coba — data tersimpan di perangkat ini.</b><p>Belum ada sinkronisasi antar pengguna. Ekspor cadangan sebelum berpindah perangkat. Jangan masukkan data sensitif.</p></section><section><h2>Tambah anggota</h2><form id="form"><label>Hubungan<select id="rel"><option value="child">Anak</option><option value="spouse">Pasangan</option></select></label><label>Anggota terkait<select id="parent"></select></label><label>Nama lengkap<input id="name" required maxlength="150"></label><label>Nama panggilan<input id="nick" maxlength="100"></label><label>Status<select id="status"><option>Belum diisi</option><option>Masih hidup</option><option>Almarhum</option><option>Almarhumah</option></select></label><button>Tambah anggota</button></form></section><section><h2>Pohon keluarga</h2><input id="search" placeholder="Cari nama"><p id="stats"></p><div id="tree"></div></section><section><button id="export">Ekspor cadangan JSON</button><label>Impor cadangan (mengganti data lokal)<input type="file" id="import" accept=".json"></label><button onclick="print()">Cetak</button></section></main><script>
const $=id=>document.getElementById(id), seed=[{id:'root',name:'R. Muhtar Gozali',parent:null,rel:'root',gen:1},{id:'root2',name:'R. Siti Kulsum',parent:'root',rel:'spouse',gen:1}];let data;try{data=JSON.parse(localStorage.getItem('gozali-v1'))||seed}catch{data=seed}function save(){localStorage.setItem('gozali-v1',JSON.stringify(data));render()}function render(){const p=$('parent');p.replaceChildren();data.forEach(a=>{let o=document.createElement('option');o.value=a.id;o.textContent='F'+a.gen+' — '+a.name;p.append(o)});$('stats').textContent=data.length+' anggota • '+Math.max(...data.map(a=>a.gen))+' generasi';const q=$('search').value.toLowerCase();function node(a){let d=document.createElement('details');d.open=true;let s=document.createElement('summary');s.textContent='F'+a.gen+' · '+a.name+(a.nick?' ('+a.nick+')':'')+(a.rel==='spouse'?' — pasangan':'');d.append(s);if(a.status){let t=document.createElement('small');t.textContent=a.status;d.append(t)}data.filter(b=>b.parent===a.id).forEach(b=>d.append(node(b)));return d}let tree=$('tree');tree.replaceChildren();if(q){data.filter(a=>(a.name+' '+(a.nick||'')).toLowerCase().includes(q)).forEach(a=>{let t=document.createElement('p');t.textContent='F'+a.gen+' · '+a.name+' — terkait: '+(data.find(b=>b.id===a.parent)?.name||'Pendiri');tree.append(t)})}else data.filter(a=>a.parent===null).forEach(a=>tree.append(node(a)))}$('form').onsubmit=e=>{e.preventDefault();let p=data.find(a=>a.id===$('parent').value),rel=$('rel').value;if(!p||!$('name').value.trim())return;data.push({id:crypto.randomUUID(),name:$('name').value.trim(),nick:$('nick').value.trim(),status:$('status').value,parent:p.id,rel,gen:p.gen+(rel==='child'?1:0)});e.target.reset();save()};$('search').oninput=render;$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='silsilah-gozali.json';a.click();URL.revokeObjectURL(a.href)};$('import').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||!a.length||new Set(a.map(x=>x.id)).size!==a.length||!a.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&Number.isInteger(x.gen)&&x.gen>0))throw Error();let m=new Map(a.map(x=>[x.id,x]));for(let x of a){let seen=new Set();while(x.parent!==null){if(seen.has(x.id)||!m.has(x.parent))throw Error();seen.add(x.id);x=m.get(x.parent)}}if(confirm('Ganti data lokal dengan cadangan ini?')){data=a;save()}}catch{alert('Cadangan tidak valid')}};render();</script></html>
